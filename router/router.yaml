supergraph:
  listen: 0.0.0.0:4000
  path: /graphql
  introspection: true

health_check:
  listen: 0.0.0.0:8088
  enabled: true

sandbox:
  enabled: true

homepage:
  enabled: false

include_subgraph_errors:
  all: true

headers:
  all:
    request:
      operations:
        - propagate:
            named: authorization
        - propagate:
            named: apollographql-client-name

traffic_shaping:
  router:
    timeout: 15s
  all:
    deduplicate_query: true
    timeout: 5s

limits:
  router:
    http_max_request_bytes: 1048576
    parser_max_recursion: 200
    parser_max_tokens: 5000

plugins:
  experimental.expose_query_plan: true

telemetry:
  exporters:
    tracing:
      common:
        service_name: router
        sampler: always_on
      propagation:
        trace_context: true
      otlp:
        enabled: true
        endpoint: http://jaeger:4317
        protocol: grpc
    metrics:
      prometheus:
        enabled: true
        listen: 0.0.0.0:9090
        path: /metrics

rhai:
  scripts: /dist/rhai
  main: main.rhai
